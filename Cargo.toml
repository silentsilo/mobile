[workspace]
resolver = "2"
members = ["src-tauri", "autofill"]

[workspace.package]
version = "1.4.0"
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-or-later"

# The shipped library. Gradle only strips the `.so` when it can find the
# NDK's strip tool, and on a release build it silently did not, so the APK
# carried 43 MB of symbols. Cargo strips before Gradle ever sees the file.
# The build machine's paths that survive stripping (panic locations from the
# registry) are remapped in `gen/android/buildSrc/.../BuildTask.kt`, because
# `trim-paths` is still unstable on the pinned toolchain.
[profile.release]
strip = "symbols"

# Pinned to a core tag, never a branch; the lockfile pins the commit.
[workspace.dependencies]
silentsilo-core = { git = "https://github.com/silentsilo/core", tag = "v1.10.0-beta.6" }
silentsilo-crypto = { git = "https://github.com/silentsilo/core", tag = "v1.10.0-beta.6" }
silentsilo-vault = { git = "https://github.com/silentsilo/core", tag = "v1.10.0-beta.6" }
silentsilo-vfs = { git = "https://github.com/silentsilo/core", tag = "v1.10.0-beta.6" }
silentsilo-store = { git = "https://github.com/silentsilo/core", tag = "v1.10.0-beta.6" }
silentsilo-sync = { git = "https://github.com/silentsilo/core", tag = "v1.10.0-beta.6" }
silentsilo-app = { git = "https://github.com/silentsilo/core", tag = "v1.10.0-beta.6" }
silentsilo-audit = { git = "https://github.com/silentsilo/core", tag = "v1.10.0-beta.6" }
# No HID stack on a phone: only the key-agreement math.
silentsilo-fido = { git = "https://github.com/silentsilo/core", tag = "v1.10.0-beta.6", default-features = false }
