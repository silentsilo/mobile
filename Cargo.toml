[workspace]
resolver = "2"
members = ["src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-or-later"

# Pinned to an exact core commit while the app is unreleased: core gets one
# tag when mobile is finished, and this moves to it then. Never a branch.
[workspace.dependencies]
silentsilo-core = { git = "https://github.com/silentsilo/core", rev = "0a75b9a7721fbc1d71275e1413f5d24f9327098a" }
silentsilo-crypto = { git = "https://github.com/silentsilo/core", rev = "0a75b9a7721fbc1d71275e1413f5d24f9327098a" }
silentsilo-vault = { git = "https://github.com/silentsilo/core", rev = "0a75b9a7721fbc1d71275e1413f5d24f9327098a" }
silentsilo-vfs = { git = "https://github.com/silentsilo/core", rev = "0a75b9a7721fbc1d71275e1413f5d24f9327098a" }
silentsilo-store = { git = "https://github.com/silentsilo/core", rev = "0a75b9a7721fbc1d71275e1413f5d24f9327098a" }
silentsilo-sync = { git = "https://github.com/silentsilo/core", rev = "0a75b9a7721fbc1d71275e1413f5d24f9327098a" }
silentsilo-app = { git = "https://github.com/silentsilo/core", rev = "0a75b9a7721fbc1d71275e1413f5d24f9327098a" }
# No HID stack on a phone: only the key-agreement math.
silentsilo-fido = { git = "https://github.com/silentsilo/core", rev = "0a75b9a7721fbc1d71275e1413f5d24f9327098a", default-features = false }
