[package]
name = "silentsilo-autofill"
description = "The iPhone's AutoFill extension: the silo opened with Face ID, its logins listed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Linked into the extension by its Xcode target (gen/apple/project.yml).
[lib]
crate-type = ["staticlib"]

[dependencies]
silentsilo-app = { workspace = true }
silentsilo-vault = { workspace = true }
silentsilo-vfs = { workspace = true }
serde_json = "1"
hex = "0.4"
zeroize = "1"

[target.'cfg(target_os = "ios")'.dependencies]
silentsilo-fido = { workspace = true, features = ["enclave"] }
# The local secret files' key, as in the app (src-tauri/src/keychain.rs).
security-framework = "3.7"
aes-gcm = "0.10"
rand = "0.9"
